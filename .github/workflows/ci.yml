# The local checks on the release's build images, one per supported Linux platform (DES-CI-WORKFLOW
# in docs/distribution.mara.md, ADR-CI-CHECKS in docs/decisions.mara.md). A failure here reproduces
# with `pnpm run checks`.
name: CI

on:
  push:
    branches: [chore/clear-worktree-for-rewrite, main]
  pull_request:

permissions:
  contents: read

# A pull request's runs share a group, so a newer one cancels the older. Each push run has a group
# of its own, so that none is cancelled or left pending behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      # Full history and tags: the conversion tests and the key of `mara:test` read `v0.3.0`.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # The toolchains, cargo-nextest included, and the dependencies, as the release sets them up.
      - uses: ./.github/actions/setup

      # Cargo's entry holds the profile and target-triple directories that the checks build into and
      # Cargo's registry, by name, so that it cannot hold `target/souffle-2.5`. Not in it: the
      # stages of nx-rust (`target/.nx-rust-stage`), the tests' scratch directory (`target/tmp`) and
      # rustc's version cache (`target/.rustc_info.json`).
      - name: Restore Cargo's build directories and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/debug
            target/release
            target/wasm32-unknown-unknown
          key: cargo-dirs-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-dirs-${{ matrix.os }}-${{ runner.arch }}-
      # Soufflé comes only from its own entry: scripts/build-souffle.sh keeps an existing binary that
      # passes its checks, so a binary of an older script must not be restored.
      - name: Restore Soufflé
        id: souffle
        uses: actions/cache/restore@v6
        with:
          path: target/souffle-2.5
          key: souffle-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-souffle.sh') }}

      # The grammar that .mara/config.toml pins, which `mara:validate` needs (DES-GRAMMAR-ASSETS).
      - run: cargo run --locked --quiet --bin mara -- --no-daemon code add rust

      # The browser of the host tests (VER-HOST-COMPARISON): Chromium's headless shell of the
      # revision that the pinned Playwright names, from Playwright's download, with the system
      # libraries it needs, into Playwright's per-user cache. Fetched on each run, never cached.
      - run: pnpm exec playwright install --with-deps --only-shell chromium

      - run: pnpm run checks
        env:
          NX_DAEMON: "false"

      # Saved also when a check failed, so that the next run does not build it again.
      - name: Save Soufflé
        if: always() && steps.souffle.outputs.cache-hit != 'true' && hashFiles('target/souffle-2.5/souffle') != ''
        uses: actions/cache/save@v6
        with:
          path: target/souffle-2.5
          key: ${{ steps.souffle.outputs.cache-primary-key }}

      - name: Check that no check changed the tree
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
