# The local checks on the release's build images, one per supported Linux platform (DES-CI-WORKFLOW
# in docs/distribution.mara.md, ADR-CI-CHECKS in docs/decisions.mara.md). A failure here reproduces
# with `pnpm run checks`.
name: CI

on:
  push:
    branches: [chore/clear-worktree-for-rewrite, main]
  pull_request:

permissions:
  contents: read

# A pull request's runs share a group, so a newer one cancels the older. Each push run has a group
# of its own, so that none is cancelled or left pending behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      # Full history and tags: the conversion tests and the key of `mara:test` read `v0.3.0`.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # The toolchains, cargo-nextest included, and the dependencies, as the release sets them up.
      - uses: ./.github/actions/setup

      # Cargo's entry holds the profile and target-triple directories that the checks build into and
      # Cargo's registry, by name, so that it cannot hold `target/souffle-2.5`. Not in it: the
      # stages of nx-rust (`target/.nx-rust-stage`), the tests' scratch directory (`target/tmp`) and
      # rustc's version cache (`target/.rustc_info.json`).
      - name: Restore Cargo's build directories and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/debug
            target/release
            target/wasm32-unknown-unknown
          key: cargo-dirs-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-dirs-${{ matrix.os }}-${{ runner.arch }}-
      # Soufflé comes only from its own entry: scripts/build-souffle.sh keeps an existing binary that
      # passes its checks, so a binary of an older script must not be restored.
      - name: Restore Soufflé
        id: souffle
        uses: actions/cache/restore@v6
        with:
          path: target/souffle-2.5
          key: souffle-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-souffle.sh') }}

      # Soufflé's WebAssembly module, likewise from its own entry: scripts/build-souffle-wasm.sh
      # keeps an existing module that passes its smoke run. The script pins the Emscripten SDK, and
      # the patch, the smoke run and the output-size guard that the smoke run checks are its inputs.
      - name: Restore Soufflé's WebAssembly module
        id: souffle-wasm
        uses: actions/cache/restore@v6
        with:
          path: target/souffle-2.5-wasm
          key: souffle-wasm-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-souffle-wasm.sh', 'scripts/souffle-emscripten.patch', 'scripts/souffle-wasm-smoke.mjs', 'packages/mara-browser/output-limit.js') }}

      # The Emscripten SDK of the version that scripts/build-souffle-wasm.sh pins, only to build
      # the module: emsdk's archive of that tag, checked against its SHA-256, which installs the
      # SDK's own LLVM, Binaryen and Node. Only `emcc` and `emcmake` go on PATH, so the checks keep
      # the job's Node. Moving the pin changes the version in the script and the SHA-256 here.
      - name: Install the Emscripten SDK
        if: steps.souffle-wasm.outputs.cache-hit != 'true'
        env:
          EMSDK_SHA256: 4dd39842a0e2cbe3b829879575fbb3fa702b224a5fd4b898c4768c00354224f9
        run: |
          version=$(sed -n 's/^EMSDK_VERSION=//p' scripts/build-souffle-wasm.sh)
          dir="$RUNNER_TEMP/emsdk"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/emsdk.tar.gz" \
            "https://github.com/emscripten-core/emsdk/archive/refs/tags/$version.tar.gz"
          echo "$EMSDK_SHA256  $RUNNER_TEMP/emsdk.tar.gz" | sha256sum -c --quiet -
          tar -xzf "$RUNNER_TEMP/emsdk.tar.gz" -C "$dir" --strip-components=1
          "$dir/emsdk" install "$version"
          "$dir/emsdk" activate "$version"
          echo "$dir/upstream/emscripten" >> "$GITHUB_PATH"

      # The grammar that .mara/config.toml pins, which `mara:validate` needs (DES-GRAMMAR-ASSETS).
      - run: cargo run --locked --quiet --bin mara -- --no-daemon code add rust

      # The browser of the host tests (VER-HOST-COMPARISON): the Chromium revision that the pinned
      # Playwright names, which they launch by its path, from Playwright's download, with the
      # system libraries it needs, into Playwright's per-user cache. Its headless shell is left out.
      # Fetched on each run, never cached.
      - run: pnpm exec playwright install --with-deps --no-shell chromium

      - run: pnpm run checks
        env:
          NX_DAEMON: "false"

      # Saved also when a check failed, so that the next run does not build it again.
      - name: Save Soufflé
        if: always() && steps.souffle.outputs.cache-hit != 'true' && hashFiles('target/souffle-2.5/souffle') != ''
        uses: actions/cache/save@v6
        with:
          path: target/souffle-2.5
          key: ${{ steps.souffle.outputs.cache-primary-key }}

      - name: Save Soufflé's WebAssembly module
        if: always() && steps.souffle-wasm.outputs.cache-hit != 'true' && hashFiles('target/souffle-2.5-wasm/souffle.wasm') != ''
        uses: actions/cache/save@v6
        with:
          path: target/souffle-2.5-wasm
          key: ${{ steps.souffle-wasm.outputs.cache-primary-key }}

      - name: Check that no check changed the tree
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
