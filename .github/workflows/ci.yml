name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --all-targets --all-features

  self-hosting:
    name: Self-hosting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build Mara CLI
        run: cargo build --locked --bin mara
      - name: Validate the Mara corpus deterministically
        run: |
          first="$(mktemp)"
          second="$(mktemp)"
          trap 'rm -f "$first" "$second"' EXIT

          set +e
          ./target/debug/mara check --format json > "$first"
          first_status=$?
          ./target/debug/mara check --format json > "$second"
          second_status=$?
          set -e

          failed=0
          if [ "$first_status" -ne 0 ]; then
            printf 'First self-hosting run failed with status %s:\n' "$first_status" >&2
            cat "$first" >&2
            failed=1
          fi
          if [ "$second_status" -ne 0 ]; then
            printf 'Second self-hosting run failed with status %s:\n' "$second_status" >&2
            cat "$second" >&2
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

          if ! cmp -s "$first" "$second"; then
            printf 'Self-hosting output was not deterministic:\n' >&2
            sha256sum "$first" "$second" >&2
            diff -u --label first-run.json --label second-run.json "$first" "$second" >&2 || true
            exit 1
          fi
