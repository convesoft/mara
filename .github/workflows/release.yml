# Builds, packs, verifies and publishes the npm packages of one commit (DES-RELEASE-WORKFLOW in
# docs/distribution.mara.md, ADR-DISPATCHED-RELEASE in docs/decisions.mara.md). It starts only by a
# manual dispatch, and a dispatch is a dry run unless its input says otherwise. It runs no checks:
# CI runs them on every commit of `main`, on the same build images. The tag, the GitHub release and
# its notes come from `nx release changelog` with the `release` block of nx.json. The Trusted
# Publisher entries of the packages name this file, release.yml.
name: Release

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: The npm dist-tag to publish under; `latest` is refused for a prerelease version
        required: true
        default: next
        type: string
      dry_run:
        description: Build, pack, verify and run npm publish --dry-run, without publishing or tagging
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# Runs of one ref wait for each other in order.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.prepare.outputs.sha }}
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
      dist_tag: ${{ steps.prepare.outputs.dist_tag }}
      packages: ${{ steps.prepare.outputs.packages }}
    steps:
      # The dispatched commit.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Record the commit, the version and the dist-tag
        id: prepare
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          REF: ${{ github.ref }}
        run: .github/scripts/release-prepare.sh

  pack-dispatcher:
    name: Pack dispatcher
    needs: prepare
    # The image on which CI builds Soufflé's WebAssembly module with the same script.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/emscripten
      # Builds the engine's WebAssembly module (`mara-wasm:build`, release, for
      # wasm32-unknown-unknown) and, through `cargo-workspace:souffle-wasm`, Soufflé's from source,
      # since no cache is restored, then packs the dispatcher with both.
      - run: pnpm nx run mara-npm:pack-dispatcher --output-style=static
        env:
          NX_DAEMON: "false"
      - uses: actions/upload-artifact@v7
        with:
          name: npm-dispatcher
          path: dist/npm/*.tgz
          if-no-files-found: error

  build:
    name: Build (${{ matrix.os }})
    needs: [prepare, pack-dispatcher]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: npm-dispatcher
          path: dist/npm
      # Builds `mara`, the Node addon `mara-node` and, through `cargo-workspace:souffle`, Soufflé
      # from source, since no cache is restored, then packs the native package.
      - run: pnpm nx run mara-npm:pack-native:release --output-style=static
        env:
          NX_DAEMON: "false"
      # The browser of the install verification's browser case, as CI installs it.
      - run: pnpm exec playwright install --with-deps --no-shell chromium
      - run: pnpm nx run mara-npm:verify-install --output-style=static
        env:
          NX_DAEMON: "false"
      # Records the SHA-256 of the tarballs that the install verification ran on, which the jobs
      # that publish or attach them compare, and keeps the native one for the artifact.
      - name: Record the verified tarballs
        env:
          PACKAGES: ${{ needs.prepare.outputs.packages }}
          OS: ${{ matrix.os }}
        run: .github/scripts/release-tarballs.sh record dist/npm "$RUNNER_TEMP/out" "$OS"
      - uses: actions/upload-artifact@v7
        with:
          name: npm-${{ matrix.os }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error

  dry-run:
    name: Dry run
    needs: [prepare, build]
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      # With every tag, from which `nx release changelog` takes the previous release.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      # nx-rust builds the project graph with cargo when `nx release changelog` runs.
      - uses: ./.github/actions/setup
      - id: tarballs
        uses: ./.github/actions/release-tarballs
        with:
          packages: ${{ needs.prepare.outputs.packages }}
      # Leaves out, with a warning, a version that npm has by then, published after Prepare's check.
      - name: npm publish --dry-run, native packages first
        env:
          PACKAGES: ${{ needs.prepare.outputs.packages }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DIST_TAG: ${{ needs.prepare.outputs.dist_tag }}
          DIRECTORY: ${{ steps.tarballs.outputs.directory }}
        run: .github/scripts/release-dry-run.sh "$DIRECTORY"
      # Prints the notes that Tag would publish, and the tag, push and release it would make, with the
      # push arguments of Tag. The release lookup uses the read-only job token. Nx also looks up
      # authors' GitHub usernames while rendering the notes.
      - name: nx release changelog --dry-run
        env:
          GH_TOKEN: ${{ github.token }}
          NX_DAEMON: "false"
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          pnpm nx release changelog "$VERSION" --dry-run --verbose \
            --git-push-args="--no-follow-tags refs/tags/$TAG" </dev/null

  publish:
    name: Publish
    needs: [prepare, build]
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
    runs-on: ubuntu-24.04
    environment:
      name: release
      url: https://www.npmjs.com/package/@convesoft/mara/v/${{ needs.prepare.outputs.version }}
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      # Without `registry-url`, so that no npm token is configured: npm authenticates through
      # Trusted Publishing with the job's OIDC token.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - id: tarballs
        uses: ./.github/actions/release-tarballs
        with:
          packages: ${{ needs.prepare.outputs.packages }}
      # The dist-tags before the run's first publication attempt, which Registry check compares.
      # An earlier attempt of this run uploaded them before it published anything; a re-run finds
      # that artifact and keeps it. Without one, no attempt has published, and the tags are read
      # now. Should the download have failed although the artifact exists, the upload below fails,
      # because an artifact's name is taken once per run.
      - name: Find the dist-tags that an earlier attempt recorded
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: dist-tags-before
          path: ${{ runner.temp }}/dist-tags
      - name: Record the dist-tags of every package before the first publication
        id: dist-tags
        env:
          PACKAGES: ${{ needs.prepare.outputs.packages }}
        run: .github/scripts/release-dist-tags.sh record "$RUNNER_TEMP/dist-tags/dist-tags-before.json"
      - if: steps.dist-tags.outputs.recorded == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dist-tags-before
          path: ${{ runner.temp }}/dist-tags/dist-tags-before.json
          if-no-files-found: error
      # Requires npm 11.5.1 or later, the first with Trusted Publishing. A re-run continues a partial
      # publication: a version that npm has with the tarball's SHA-1 is skipped, one with another
      # fails, and only a version that npm reports absent is published. The packages for any
      # platform follow once npm shows every native package.
      - name: Publish the native packages, then the dispatcher
        env:
          PACKAGES: ${{ needs.prepare.outputs.packages }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DIST_TAG: ${{ needs.prepare.outputs.dist_tag }}
          DIRECTORY: ${{ steps.tarballs.outputs.directory }}
        run: .github/scripts/release-publish.sh "$DIRECTORY" --provenance

  registry-check:
    name: Registry check (${{ matrix.os }})
    needs: [prepare, publish]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Each try has an empty directory and npm cache, so that an installation that missed a native
      # package which npm did not serve yet is not reused, and stops after 5 minutes.
      - name: npx @convesoft/mara@<version> --version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: .github/scripts/release-npx-check.sh
      # The browser of the install verification's browser case, as CI installs it.
      - run: pnpm exec playwright install --with-deps --no-shell chromium
      - run: pnpm nx run mara-npm:verify-install "--registry=$VERSION" --output-style=static
        env:
          NX_DAEMON: "false"
          VERSION: ${{ needs.prepare.outputs.version }}
      - uses: actions/download-artifact@v8
        with:
          name: dist-tags-before
          path: ${{ runner.temp }}/dist-tags
      # The other dist-tags are compared as JSON values, so that their order does not matter.
      - name: Check every package's dist-tags
        env:
          PACKAGES: ${{ needs.prepare.outputs.packages }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DIST_TAG: ${{ needs.prepare.outputs.dist_tag }}
        run: .github/scripts/release-dist-tags.sh check "$RUNNER_TEMP/dist-tags/dist-tags-before.json"

  tag:
    name: Tag
    needs: [prepare, registry-check]
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
    runs-on: ubuntu-24.04
    environment:
      name: release
    permissions:
      contents: write
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ needs.prepare.outputs.sha }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      NX_DAEMON: "false"
    steps:
      # With the job's token in Git's configuration, which pushes the tag, and with every tag, from
      # which `nx release changelog` takes the previous release.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      # nx-rust builds the project graph with cargo when `nx release changelog` runs.
      - uses: ./.github/actions/setup
      - id: tarballs
        uses: ./.github/actions/release-tarballs
        with:
          packages: ${{ needs.prepare.outputs.packages }}
      # Makes only what a re-run finds missing: the tag, pushed alone, and the release with its notes,
      # or the release alone; an existing release and its notes are kept.
      - name: Tag and create the GitHub release with nx release changelog
        run: .github/scripts/release-tag.sh
      # An asset of the release in another state than `uploaded` is an interrupted upload, which is
      # deleted and attached again; an uploaded one must have this run's SHA-256.
      - name: Attach the tarballs and SHA256SUMS to the GitHub release
        env:
          DIRECTORY: ${{ steps.tarballs.outputs.directory }}
        run: .github/scripts/release-attach.sh "$DIRECTORY"
