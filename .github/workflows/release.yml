name: Release

on:
  push:
    branches: [main]
    paths:
      - CHANGELOG.md

permissions:
  contents: read

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  QUERY_PROOF_SNAPSHOT: ${{ github.workspace }}/tests/fixtures/query-backend/snapshot.json
  QUERY_FACTS_SNAPSHOT: ${{ github.workspace }}/tests/fixtures/query-facts/snapshot.json

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      npm-tag: ${{ steps.release.outputs.npm-tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set test runtime directories
        shell: bash
        run: |
          set -euo pipefail
          # Keep the host temporary directory private and resolve macOS /var aliases.
          # Fixtures compare their paths with canonical paths returned by the host.
          temporary=$(cd -- "${TMPDIR:-$RUNNER_TEMP}" && pwd -P)
          echo "TMPDIR=$temporary" >> "$GITHUB_ENV"
          # Socket tests need a short private path on both supported hosts.
          runtime=$(mktemp -d /tmp/mara-ipc.XXXXXX)
          {
            echo "MARA_NODE_RUNTIME=$runtime"
            echo "MARA_TEST_RUNTIME_DIR=$runtime"
            echo "BROWSER_RUNTIME_TMPDIR=$runtime"
            echo "MARA_QUERY_PROOF_REPORT=$RUNNER_TEMP/native-query-proof.json"
            echo "MARA_QUERY_FACTS_REPORT=$RUNNER_TEMP/native-query-facts.json"
            echo "MARA_QUERY_CATALOG_REPORT=$RUNNER_TEMP/native-query-catalog.json"
            echo "MARA_QUERY_CATALOG_NODE_REPORT=$RUNNER_TEMP/installed-query-catalog.json"
          } >> "$GITHUB_ENV"
      - run: rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          shared-key: source-verify
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Resolve and validate release identity
        id: release
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          checked_out_sha=$(git rev-parse HEAD)
          if [[ "$checked_out_sha" != "$RELEASE_SHA" ]]; then
            echo "checked out $checked_out_sha instead of release commit $RELEASE_SHA" >&2
            exit 1
          fi

          cargo_version=$(cargo metadata --no-deps --format-version 1 \
            | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>process.stdout.write(JSON.parse(s).packages[0].version))')
          tag="v$cargo_version"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            tagged_sha=$(git rev-list -n 1 "$tag")
            if [[ "$tagged_sha" != "$RELEASE_SHA" ]]; then
              echo "$tag points to $tagged_sha instead of $RELEASE_SHA" >&2
              exit 1
            fi
          fi

          grep -F "## [$cargo_version]" CHANGELOG.md >/dev/null
          if [[ "$cargo_version" == *-* ]]; then
            npm_tag=next
            prerelease=true
          else
            npm_tag=latest
            prerelease=false
          fi

          {
            echo "sha=$RELEASE_SHA"
            echo "version=$cargo_version"
            echo "tag=$tag"
            echo "npm-tag=$npm_tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
      - run: mkdir -p "$CARGO_TARGET_DIR"
      - run: VERIFY_EVIDENCE_DIR="$RUNNER_TEMP/verification" scripts/verify.sh full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-source-verification
          path: ${{ runner.temp }}/verification/
          if-no-files-found: warn
      - name: Verify generated changelog
        uses: orhun/git-cliff-action@v4.8.0
        with:
          config: cliff.toml
          args: --tag ${{ steps.release.outputs.tag }}
        env:
          OUTPUT: generated-CHANGELOG.md
      - run: diff -u CHANGELOG.md generated-CHANGELOG.md
      - run: rustup target add wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.127
      - run: scripts/build-browser.sh "$RUNNER_TEMP/browser-assets"
      - name: Pack platform-independent main artifact before approval
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dist"
          package=$(node scripts/package-npm.mjs main "$RUNNER_TEMP/stage" "$RUNNER_TEMP/browser-assets")
          npm pack "$package" --pack-destination "$RUNNER_TEMP/dist" --json > "$RUNNER_TEMP/main-pack.json"
      - uses: actions/upload-artifact@v4
        with:
          name: release-browser-inputs
          path: ${{ runner.temp }}/browser-assets/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-main
          path: ${{ runner.temp }}/dist/*.tgz
          if-no-files-found: error
          retention-days: 7
      - name: Remove test IPC directory
        if: always()
        shell: bash
        run: |
          if [[ -n "${BROWSER_RUNTIME_TMPDIR:-}" ]]; then rm -rf -- "$BROWSER_RUNTIME_TMPDIR"; fi


  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Set test runtime directories
        shell: bash
        run: |
          set -euo pipefail
          # Keep the host temporary directory private and resolve macOS /var aliases.
          # Fixtures compare their paths with canonical paths returned by the host.
          temporary=$(cd -- "${TMPDIR:-$RUNNER_TEMP}" && pwd -P)
          echo "TMPDIR=$temporary" >> "$GITHUB_ENV"
          # Socket tests need a short private path on both supported hosts.
          runtime=$(mktemp -d /tmp/mara-ipc.XXXXXX)
          {
            echo "MARA_NODE_RUNTIME=$runtime"
            echo "MARA_TEST_RUNTIME_DIR=$runtime"
            echo "BROWSER_RUNTIME_TMPDIR=$runtime"
            echo "MARA_QUERY_PROOF_REPORT=$RUNNER_TEMP/native-query-proof.json"
            echo "MARA_QUERY_FACTS_REPORT=$RUNNER_TEMP/native-query-facts.json"
            echo "MARA_QUERY_CATALOG_REPORT=$RUNNER_TEMP/native-query-catalog.json"
            echo "MARA_QUERY_CATALOG_NODE_REPORT=$RUNNER_TEMP/installed-query-catalog.json"
          } >> "$GITHUB_ENV"
      - run: rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          # Replace the partial archive saved by an earlier failed native job.
          shared-key: native-artifacts-v1
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
      - run: cargo clippy --locked --workspace --all-targets --all-features -j 2 -- -D warnings
      - run: cargo nextest run --locked --workspace --all-targets --ignore-default-filter --build-jobs 2
      - run: cargo test --locked --workspace --doc -j 2
      - run: cargo build --locked --release -p mara -j 2
      - run: scripts/build-node.sh "$RUNNER_TEMP/addon" --release
      - uses: actions/download-artifact@v4
        with:
          name: release-browser-inputs
          path: ${{ runner.temp }}/browser-assets
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts-main
          path: ${{ runner.temp }}/prepared-main
      - run: scripts/smoke-npm.sh "$CARGO_TARGET_DIR/release/mara" "$RUNNER_TEMP/addon/mara.node" "$RUNNER_TEMP/browser-assets" "$RUNNER_TEMP/smoke"
      - name: Verify the prepared main tarball is the installed candidate
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: cmp "$RUNNER_TEMP/prepared-main/convesoft-mara-$VERSION.tgz" "$RUNNER_TEMP/smoke/tarballs/convesoft-mara-$VERSION.tgz"
      - name: Verify corresponding-host source and installed addon
        shell: bash
        run: |
          set -euo pipefail
          NODE24=$(command -v node)
          export NODE24
          export MARA_NODE_ADDON="$RUNNER_TEMP/addon/mara.node"
          cargo test --locked --test node_binding real_node_addon -j 2 -- --ignored --exact --nocapture
          # The complete installed gate runs after TypeScript compilation below.
      - name: Verify installed TypeScript and Chromium clients
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/js-tools"
          npm install --prefix "$tools" --ignore-scripts --no-audit --no-fund \
            typescript@5.9.3 @types/node@24.12.0 @playwright/test@1.58.2 serve@14.2.4
          consumer="$RUNNER_TEMP/smoke/install"
          cp tests/node/usage.mts tests/node/http-usage.mts "$consumer/"
          "$tools/node_modules/.bin/tsc" --strict --noUncheckedIndexedAccess --target ES2022 \
            --module NodeNext --moduleResolution NodeNext --typeRoots "$tools/node_modules/@types" \
            --outDir "$consumer/typed" "$consumer/usage.mts" "$consumer/http-usage.mts"
          NODE24=$(command -v node)
          export NODE24 MARA_NODE_INSTALLED=1
          export MARA_NODE_ADDON="$RUNNER_TEMP/addon/mara.node"
          export MARA_NODE_CLIENT="$consumer/node_modules/@convesoft/mara/node.mjs"
          export MARA_NODE_FIXTURES="$RUNNER_TEMP/typed-fixtures"
          mkdir -p "$MARA_NODE_FIXTURES"
          export MARA_NODE_TYPED_CONSUMER="$consumer/typed/usage.mjs"
          cargo test --locked --test node_binding installed_node_client -j 2 -- --ignored --exact --nocapture
          export MARA_HTTP_PACKAGE="$consumer/node_modules/@convesoft/mara"
          node --test tests/node/http.test.mjs
          browser_consumer="$RUNNER_TEMP/smoke/browser-only"
          cp tests/browser/usage.mts "$browser_consumer/"
          "$tools/node_modules/.bin/tsc" --strict --noUncheckedIndexedAccess --target ES2022 \
            --module NodeNext --moduleResolution NodeNext --lib ES2022,DOM \
            --outDir "$browser_consumer/typed" "$browser_consumer/usage.mts"
          export BROWSER_ASSETS_DIR="$browser_consumer/node_modules/@convesoft/mara"
          cp "$browser_consumer/typed/usage.mjs" "$BROWSER_ASSETS_DIR/usage.mjs"
          mkdir -p "$tools/tests"
          cp -R tests/browser "$tools/tests/browser"
          "$tools/node_modules/.bin/playwright" install --with-deps chromium
          export CHROMIUM_PATH
          CHROMIUM_PATH=$(node --input-type=module -e \
            "import {chromium} from '$tools/node_modules/playwright/index.mjs'; console.log(chromium.executablePath())")
          export MARA_CLI="$consumer/node_modules/.bin/mara"
          export BROWSER_REPORT="$RUNNER_TEMP/browser-report.json" BROWSER_RESULTS="$RUNNER_TEMP/browser-results"
          DEBUG=pw:webserver "$tools/node_modules/.bin/playwright" test --config "$tools/tests/browser/playwright.config.mjs"
      - name: Assemble native release archives from verified inputs
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dist/native"
          cp "$RUNNER_TEMP/smoke/tarballs/convesoft-mara-"*-"$VERSION.tgz" "$RUNNER_TEMP/dist/"

          archive="mara-$VERSION-$TARGET"
          mkdir -p "$RUNNER_TEMP/dist/native/$archive"
          cp "$CARGO_TARGET_DIR/release/mara" "$RUNNER_TEMP/dist/native/$archive/mara"
          cp README.md LICENSE-MIT LICENSE-APACHE "$RUNNER_TEMP/dist/native/$archive/"
          tar -C "$RUNNER_TEMP/dist/native" -czf "$RUNNER_TEMP/dist/$archive.tar.gz" "$archive"
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/dist/*.tar.gz
            ${{ runner.temp }}/dist/*.tgz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/smoke/*-pack.json
            target/nextest/default/junit.xml
            ${{ runner.temp }}/native-query-*.json
            ${{ runner.temp }}/installed-query-catalog.json
            ${{ runner.temp }}/browser-report.json
            ${{ runner.temp }}/browser-results/
          if-no-files-found: warn
      - name: Remove test IPC directory
        if: always()
        shell: bash
        run: |
          if [[ -n "${BROWSER_RUNTIME_TMPDIR:-}" ]]; then rm -rf -- "$BROWSER_RUNTIME_TMPDIR"; fi

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      NPM_TAG: ${{ needs.prepare.outputs.npm-tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify trusted-publishing runtime
        run: |
          set -euo pipefail
          if [[ -n "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "NODE_AUTH_TOKEN must be unset so npm uses GitHub OIDC" >&2
            exit 1
          fi
          for variable in ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN; do
            if [[ -z "${!variable:-}" ]]; then
              echo "$variable is unavailable; check id-token: write permission" >&2
              exit 1
            fi
          done
      - run: npm install --global npm@11.19.1
      - uses: actions/download-artifact@v4
        with:
          pattern: release-artifacts-*
          path: dist
          merge-multiple: true
      - name: Check verified artifact inventory and generate checksums
        run: |
          set -euo pipefail
          test -f "dist/convesoft-mara-$VERSION.tgz"
          (cd dist && sha256sum -- *.tar.gz *.tgz > SHA256SUMS)
      - name: Create or verify annotated tag
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            tagged_sha=$(git rev-list -n 1 "$TAG")
            if [[ "$tagged_sha" != "$RELEASE_SHA" ]]; then
              echo "$TAG points to $tagged_sha instead of $RELEASE_SHA" >&2
              exit 1
            fi
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag --annotate "$TAG" --message "Mara $VERSION" "$RELEASE_SHA"
            git push origin "refs/tags/$TAG"
          fi
      - name: Create or update draft GitHub release
        env:
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz dist/*.tgz dist/SHA256SUMS --clobber
          else
            arguments=(
              "$TAG"
              --draft
              --verify-tag
              --title "Mara $VERSION"
              --notes-file release-notes.md
            )
            if [[ "$PRERELEASE" == true ]]; then
              arguments+=(--prerelease)
            fi
            gh release create "${arguments[@]}" dist/*.tar.gz dist/*.tgz dist/SHA256SUMS
          fi
      - name: Publish native npm packages
        run: |
          set -euo pipefail

          publish_or_verify() {
            local package_name=$1
            local tarball=$2
            local expected actual
            expected=$(sha1sum "$tarball" | cut -d ' ' -f 1)
            if actual=$(npm view "$package_name@$VERSION" dist.shasum --json 2>/dev/null \
              | tr -d '"[:space:]'); then
              if [[ "$actual" != "$expected" ]]; then
                echo "$package_name@$VERSION exists with a different tarball digest" >&2
                exit 1
              fi
              echo "$package_name@$VERSION already matches $expected"
            else
              npm publish "$tarball" --access public --tag "$NPM_TAG"
            fi
          }

          for package_name in \
            @convesoft/mara-linux-x64-gnu \
            @convesoft/mara-linux-arm64-gnu \
            @convesoft/mara-darwin-arm64
          do
            package_file=${package_name#@convesoft/}
            package_file=${package_file//\//-}
            tarball="$PWD/dist/convesoft-$package_file-$VERSION.tgz"
            test -f "$tarball"
            publish_or_verify "$package_name" "$tarball"
          done
      - name: Wait for native packages to become installable
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            missing=0
            for package_name in \
              @convesoft/mara-linux-x64-gnu \
              @convesoft/mara-linux-arm64-gnu \
              @convesoft/mara-darwin-arm64
            do
              npm view "$package_name@$VERSION" version >/dev/null 2>&1 || missing=1
            done
            if [[ "$missing" == 0 ]]; then
              exit 0
            fi
            echo "native packages are still processing (attempt $attempt/60)"
            sleep 30
          done
          echo "native packages did not become visible within 30 minutes" >&2
          exit 1
      - name: Publish dispatcher last
        run: |
          set -euo pipefail
          tarball="$PWD/dist/convesoft-mara-$VERSION.tgz"
          expected=$(sha1sum "$tarball" | cut -d ' ' -f 1)
          if actual=$(npm view "@convesoft/mara@$VERSION" dist.shasum --json 2>/dev/null \
            | tr -d '"[:space:]'); then
            if [[ "$actual" != "$expected" ]]; then
              echo "@convesoft/mara@$VERSION exists with a different tarball digest" >&2
              exit 1
            fi
          else
            npm publish "$tarball" --access public --tag "$NPM_TAG"
          fi
      - name: Public registry smoke test
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if npm view "@convesoft/mara@$VERSION" version >/dev/null 2>&1; then
              temporary=$(mktemp -d)
              trap 'rm -rf -- "$temporary"' EXIT
              cd "$temporary"
              npx --yes "@convesoft/mara@$VERSION" --version \
                | grep -F "mara $VERSION"
              exit 0
            fi
            echo "dispatcher is still processing (attempt $attempt/60)"
            sleep 30
          done
          echo "dispatcher did not become visible within 30 minutes" >&2
          exit 1
      - name: Publish GitHub release
        run: |
          set -euo pipefail
          if [[ "${{ needs.prepare.outputs.prerelease }}" == true ]]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi
