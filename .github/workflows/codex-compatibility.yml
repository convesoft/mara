name: Codex Compatibility

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated Mara release tag to test
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    env:
      MARA_CODEX_HOME: ${{ runner.temp }}/mara-codex-smoke
      MARA_PROJECT: ${{ runner.temp }}/mara-codex-project
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Resolve release version
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == workflow_dispatch ]]; then
            TAG="${{ inputs.tag }}"
          else
            VERSION=$(cargo metadata --no-deps --format-version 1 \
              | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>process.stdout.write(JSON.parse(s).packages[0].version))')
            TAG="v$VERSION"
          fi
          VERSION=${VERSION:-${TAG#v}}
          test "$TAG" = "v$VERSION"
          test "$(git rev-list -n 1 "$TAG")" = "$(git rev-parse HEAD)"
          test "$(node -p 'require("./.agents/plugins/marketplace.json").name')" = \
            convesoft
          {
            echo "TAG=$TAG"
            echo "VERSION=$VERSION"
          } >> "$GITHUB_ENV"
      - name: Install through the Codex marketplace and exercise MCP
        run: |
          set -euo pipefail
          mkdir -p "$MARA_CODEX_HOME"
          export CODEX_HOME="$MARA_CODEX_HOME"
          codex=(npx --yes @openai/codex@0.152.0)
          "${codex[@]}" plugin marketplace add convesoft/mara --ref "$TAG" --json
          install_json=$("${codex[@]}" plugin add mara@convesoft --json)
          installed_version=$(node -e \
            'process.stdout.write(JSON.parse(process.argv[1]).version)' \
            "$install_json")
          plugin_root=$(node -e \
            'process.stdout.write(JSON.parse(process.argv[1]).installedPath)' \
            "$install_json")
          test "$installed_version" = "$VERSION"
          test -f "$plugin_root/mcp.json"
          test -f "$plugin_root/skills/mara/SKILL.md"
          test -x "$plugin_root/bin/mara-plugin.cjs"

          node scripts/smoke-codex-plugin.mjs \
            "$MARA_PROJECT" "${codex[@]}"
          test -f "$MARA_PROJECT/.mara/project.toml"
          test -f "$MARA_PROJECT/.mara/schema.yaml"
