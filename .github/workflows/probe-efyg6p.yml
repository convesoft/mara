# Temporary probe for mara-efyg6p; never merged.
name: probe-efyg6p
on:
  push:
    branches: [probe/mara-efyg6p]
permissions:
  contents: read
jobs:
  probe:
    name: Probe (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - run: |
          uname -r
          findmnt -T .
      - run: rustup toolchain install
      - name: Install cargo-nextest
        env:
          VERSION: 0.9.152
          SHA256_X64: d039b43c3e0958441b6ad0a39c8884d018b3d2e8fb9928f209074b1100b5e17a
          SHA256_ARM64: ca1f81a5b86533eb45ab97e0064aa88e925e53aab9a698ca6331a7cad1f85f07
        run: |
          case "$RUNNER_ARCH" in
            X64) triple=x86_64-unknown-linux-gnu sha256=$SHA256_X64 ;;
            ARM64) triple=aarch64-unknown-linux-gnu sha256=$SHA256_ARM64 ;;
          esac
          archive="$RUNNER_TEMP/cargo-nextest.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$VERSION/cargo-nextest-$VERSION-$triple.tar.gz"
          echo "$sha256  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/nextest"
          tar -xzf "$archive" -C "$RUNNER_TEMP/nextest" cargo-nextest
          echo "$RUNNER_TEMP/nextest" >> "$GITHUB_PATH"
      - name: Build the tests
        run: cargo nextest run -p mara --locked --lib --test inputs --test write --no-run
      - name: The three integration tests and the tick tests, 40 times
        run: |
          fails=0
          for i in $(seq 40); do
            if ! cargo nextest run -p mara --locked --lib --test inputs --test write --no-fail-fast -E 'test(a_moved_document_is_read_but_not_parsed_again) | test(an_added_document_is_parsed_and_a_removed_one_dropped) | test(a_written_item_loads_and_the_project_stays_valid) | test(_in_the_tick_of_the_)' > "$RUNNER_TEMP/run.txt" 2>&1; then
              fails=$((fails + 1))
              echo "=== run $i failed"
              grep -E '^ +FAIL \[|panicked|left:|right:' "$RUNNER_TEMP/run.txt" | sort -u
            fi
          done
          grep -E 'Summary' "$RUNNER_TEMP/run.txt"
          echo "runs with a failure: $fails of 40"
