# The Emscripten SDK step of DES-CI-WORKFLOW (docs/distribution.mara.md), shared by ci.yml, before
# it builds Soufflé's WebAssembly module, and release.yml, whose Pack dispatcher builds the module it
# packs (DES-RELEASE-WORKFLOW). Runs after the checkout.
name: Install the Emscripten SDK
description: >-
  Installs the Emscripten SDK of the version that scripts/build-souffle-wasm.sh pins, from emsdk's
  archive of that tag checked against its SHA-256, and puts only its upstream/emscripten on PATH.
runs:
  using: composite
  steps:
    # emsdk's archive of that tag, checked against its SHA-256, installs the SDK's own LLVM,
    # Binaryen and Node. Only `emcc` and `emcmake` go on PATH, so the job keeps its Node. Moving
    # the pin changes the version in the script and the SHA-256 here.
    - name: Install the Emscripten SDK
      shell: bash
      env:
        EMSDK_SHA256: 4dd39842a0e2cbe3b829879575fbb3fa702b224a5fd4b898c4768c00354224f9
      run: |
        version=$(sed -n 's/^EMSDK_VERSION=//p' scripts/build-souffle-wasm.sh)
        dir="$RUNNER_TEMP/emsdk"
        mkdir -p "$dir"
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/emsdk.tar.gz" \
          "https://github.com/emscripten-core/emsdk/archive/refs/tags/$version.tar.gz"
        echo "$EMSDK_SHA256  $RUNNER_TEMP/emsdk.tar.gz" | sha256sum -c --quiet -
        tar -xzf "$RUNNER_TEMP/emsdk.tar.gz" -C "$dir" --strip-components=1
        "$dir/emsdk" install "$version"
        "$dir/emsdk" activate "$version"
        echo "$dir/upstream/emscripten" >> "$GITHUB_PATH"
