name: Bug report
description: Report observable behavior that may violate Mara's documented contract.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        GitHub Issues are Mara's public intake channel. Accepted durable semantics
        are recorded in the Mara documents; delivery is scheduled in Linear.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened, including complete diagnostic output where useful?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened? Cite a Mara item ID if one already defines it.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest project, document, or command sequence that reproduces the problem.
      placeholder: |
        1. Create ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Mara version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Rust version, shell, and other relevant details.
