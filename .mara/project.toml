format_version = 3

[project]
name = "mara"
schema = ".mara/schema.yaml"

[content]
include = ["docs/**/*.mara.md"]

[rules]
format_version = 1
files = [".mara/engineering-rules.yaml"]

[[code.languages]]
name = "rust"
extensions = ["rs"]
grammar = ".mara/code/rust.wasm"
query = ".mara/code/rust.scm"
separator = "::"

[[code.languages]]
name = "javascript"
extensions = ["js", "mjs", "cjs"]
grammar = ".mara/code/javascript.wasm"
query = ".mara/code/javascript.scm"
separator = "."
