[package]
name = "mara-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake3 = "1.8"
pulldown-cmark = { version = "0.13.6", default-features = false }
# The rows of a request's inputs (DES-REQUEST-INPUTS), and the NFC form of `folded` facts
# (DES-FACT-BRIDGE).
serde_json = "1.0.154"
unicode-normalization = "0.1.24"
toml = { version = "1.1.8", default-features = false, features = ["std", "parse"] }

# Counts allocations with a global allocator, so no harness thread may allocate beside it.
[[test]]
name = "diagnostic_memory"
harness = false

# Nx keys (nx-rust): files outside the crate that its unit tests read by `include_str!`, which every
# compiling target builds.
[package.metadata.nx]
fileInputs = ["../../docs/format.mara.md", "../../docs/rules/index.mara.md"]

# The `wasm32` architecture check of the local checks: `nx run mara-engine:build:wasm32`.
[package.metadata.nx.targets.build.configurations.wasm32]
targetTriple = "wasm32-unknown-unknown"
