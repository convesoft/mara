[package]
name = "mara-engine"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Explicit-input Mara document parsing, navigation and source conformance"

[dependencies]
globset = "0.4"
ignore = "0.4"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.2"
toml = "1.1"
sha2 = "0.10"
rushdown = "0.18.0"
ulid = { version = "1", default-features = false }
petgraph = { version = "0.8.3", default-features = false, features = ["std"] }
strsim = "0.11"
unicode-casefold = "0.2"
unicode-normalization = "0.1"
unicode-segmentation = "1.13"
url = "2.5"
shacl = { version = "=0.3.24", default-features = false }
rudof_rdf = { version = "=0.3.24", default-features = false }
rudof_iri = "=0.3.24"
