format_version = 1
statuses = ["draft", "accepted", "retired"]

[types.goal]
id_prefix = "GOAL-"
description = "A desired stakeholder or engineering outcome and why it matters."

[types.need]
id_prefix = "NEED-"
description = "A stakeholder capability, condition or result."

[types.scenario]
id_prefix = "SCN-"
description = "A concrete operational situation or flow and its outcomes."

[types.requirement]
id_prefix = "REQ-"
description = "One precise, necessary, verifiable obligation on the solution."

[types.design]
id_prefix = "DES-"
description = "A durable interface, format, boundary or realization."

[types.decision]
id_prefix = "ADR-"
description = "A consequential choice, its alternatives, context and rationale."

[types.risk]
id_prefix = "RISK-"
description = "An uncertain cause with an adverse consequence."

[types.risk.fields.likelihood]
kind = "enum"
values = ["rare", "unlikely", "possible", "likely", "almost-certain"]

[types.risk.fields.consequence]
kind = "enum"
values = ["minimal", "minor", "moderate", "major", "severe"]

[types.term]
id_prefix = "TERM-"
description = "A canonical definition whose ambiguity affects engineering work."

[types.term.fields.aliases]
kind = "text"

[types.evidence]
id_prefix = "EVD-"
description = "A durable empirical or analytical conclusion with provenance."

[types.verification]
id_prefix = "VER-"
description = "How requirement conformity is established."

[types.verification.fields.methods]
kind = "enum"
values = ["test", "analysis", "inspection", "demonstration"]

[types.validation]
id_prefix = "VAL-"
description = "How need satisfaction or goal achievement is established."

[types.validation.fields.methods]
kind = "enum"
values = ["test", "analysis", "inspection", "demonstration"]

[relations.contributes_to]
inverse = "contributed_to_by"
description = "The source helps achieve the target."
targets = { need = ["goal"], design = ["goal"] }

[relations.satisfies]
inverse = "satisfied_by"
description = "The source is intended to fulfil the target."
targets = { requirement = ["need"], design = ["requirement"] }

[relations.decomposes]
inverse = "decomposed_by"
description = "The source is a part of the target."
targets = { need = ["need"], requirement = ["requirement"], design = ["design"] }

[relations.derives_from]
inverse = "gives_rise_to"
description = "The source follows from the target."
targets = { requirement = ["requirement"] }

[relations.supersedes]
inverse = "superseded_by"
description = "The source replaces the target."
targets = { goal = ["goal"], need = ["need"], scenario = ["scenario"], requirement = ["requirement"], design = ["design"], decision = ["decision"], term = ["term"], verification = ["verification"], validation = ["validation"] }

[relations.justifies]
inverse = "justified_by"
description = "The source gives the reason for the target."
targets = { decision = ["requirement", "design"] }

[relations.accepts]
inverse = "accepted_by"
description = "The source accepts the target risk."
targets = { decision = ["risk"] }

[relations.threatens]
inverse = "threatened_by"
description = "The source endangers the target."
targets = { risk = ["goal", "need", "requirement"] }

[relations.mitigates]
inverse = "mitigated_by"
description = "The source reduces the target risk."
targets = { requirement = ["risk"], design = ["risk"] }

[relations.verifies]
inverse = "verified_by"
description = "The source establishes conformity to the target."
targets = { verification = ["requirement"] }

[relations.validates]
inverse = "validated_by"
description = "The source establishes satisfaction of the target."
targets = { validation = ["need", "goal"] }

[relations.exercises]
inverse = "exercised_by"
description = "The source runs through the target scenario."
targets = { validation = ["scenario"] }

[relations.supports]
inverse = "supported_by"
description = "The source is evidence for the target."
targets = { evidence = ["goal", "need", "requirement", "design", "decision", "risk"] }

[relations.implements]
inverse = "implemented_by"
description = "Code realizes the target."
targets = { code = ["requirement", "design", "verification"] }
