[package]
name = "mara"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ignore = "0.4"
mara-engine = { path = "../mara-engine" }
# The conversion of a 0.3.0 project (REQ-CONVERT-DIRECTIVE-CORPUS): its include patterns, YAML
# schema and Markdown, and the report file.
globset = "0.4"
granit-parser = "1"
pulldown-cmark = { version = "0.13.6", default-features = false }
serde_json = "1.0.154"
toml = { version = "1.1.8", default-features = false, features = ["std", "parse"] }

[dev-dependencies]
tempfile = "3.27"

# The CPU time of the scaling test (DES-PERFORMANCE-HARNESS).
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.191"
