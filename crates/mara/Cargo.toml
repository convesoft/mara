[package]
name = "mara"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ignore = "0.4"
mara-engine = { path = "../mara-engine" }
# The conversion of a 0.3.0 project (REQ-CONVERT-DIRECTIVE-CORPUS): its include patterns, YAML
# schema and Markdown, and the report file.
globset = "0.4"
granit-parser = "1"
pulldown-cmark = { version = "0.13.6", default-features = false }
serde_json = "1.0.154"
# The pin that `code add` writes is encoded by `display`, whose values need `serde`.
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "display", "serde"] }
# `mara mcp` (ADR-RMCP-SERVER): the protocol, and the single-threaded runtime that only that
# command starts.
rmcp = { version = "3.10.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt"] }
# Grammar-level code markers (DES-GRAMMAR-ASSETS): grammars run as WebAssembly in tree-sitter's
# store, which its `wasm` feature builds on wasmtime.
tree-sitter = { version = "0.27.0", features = ["wasm"] }
# `code add` (ADR-UREQ-RUSTLS-FETCH): HTTPS through rustls with the WebPKI roots, and nothing else
# of `ureq`.
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
# The private directory of an evaluation (DES-RULE-EXECUTION), removed when it ends.
tempfile = "3.27"

# The limits of the `souffle` child process (DES-RULE-EXECUTION); the daemon's user ID, peer
# credentials, `fork`, `setsid` and signals (DES-DAEMON-LIFECYCLE); and the CPU time of the
# scaling test (DES-PERFORMANCE-HARNESS).
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
# An interrupted evaluation removes its private directory before Mara ends (DES-RULE-EXECUTION).
signal-hook = { version = "0.3.18", default-features = false }

# Nx keys (nx-rust): files outside the crate that its integration tests read by `include_str!`,
# which every compiling target builds.
[package.metadata.nx]
fileInputs = [
  "../../docs/code/index.mara.md",
  "../../docs/project.mara.md",
  "../../docs/template/vocabulary.mara.md",
]

# What the tests read at run time: `docs/` and `.mara/` of this repository, the variables that the
# client and its test hooks read, `TMPDIR`, under which the daemon tests derive socket paths of
# limited length, the mode and bytes of the pinned Soufflé that `scripts/build-souffle.sh` builds
# beside the artifact directory, and the tag `v0.3.0` that the conversion tests archive.
[package.metadata.nx.targets.test]
inputs = [
  "...",
  "{workspaceRoot}/docs/**/*",
  "{workspaceRoot}/.mara/**/*",
  { env = "CI" },
  { env = "MARA_NO_DAEMON" },
  { env = "TMPDIR" },
  { env = "MARA_TEST_PAUSE" },
  { env = "MARA_TEST_PAUSE_EVALUATION" },
  { env = "MARA_TEST_PAUSE_WATCH" },
  { env = "MARA_TEST_DERIVED" },
  { env = "MARA_TEST_IDLE_SECONDS" },
  { env = "MARA_TEST_GRAMMAR_LOAD_MS" },
  { env = "MARA_TEST_GRAMMAR_BUDGET_MS" },
  { env = "MARA_TEST_GRAMMAR_STALL" },
  { env = "MARA_TEST_GRAMMAR_LOAD_STALL" },
  { env = "MARA_TEST_GRAMMAR_EVENTS" },
  { env = "MARA_TEST_GRAMMAR_CATALOG" },
  { runtime = "s=${CARGO_TARGET_DIR:-target}/souffle-2.5/souffle; ls -Ln \"$s\" 2>&1 | cut -c1-10; sha256sum \"$s\" 2>&1; true" },
  { runtime = "git rev-parse 'v0.3.0^{tree}' 2>&1 || true" },
]
