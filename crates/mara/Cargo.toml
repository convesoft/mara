[package]
name = "mara"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ignore = "0.4"
mara-engine = { path = "../mara-engine" }
# The conversion of a 0.3.0 project (REQ-CONVERT-DIRECTIVE-CORPUS): its include patterns, YAML
# schema and Markdown, and the report file.
globset = "0.4"
granit-parser = "1"
pulldown-cmark = { version = "0.13.6", default-features = false }
serde_json = "1.0.154"
# The pin that `code add` writes is encoded by `display`, whose values need `serde`.
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "display", "serde"] }

# What only the native hosts do, which the browser workspace's WebAssembly build of the library
# leaves out (DES-BROWSER-WORKSPACE).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# `mara mcp` (ADR-RMCP-SERVER): the protocol, and the single-threaded runtime that only that
# command starts.
rmcp = { version = "3.10.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt"] }
# Grammar-level code markers (DES-GRAMMAR-ASSETS): grammars run as WebAssembly in tree-sitter's
# store, which its `wasm` feature builds on wasmtime.
tree-sitter = { version = "0.27.0", features = ["wasm"] }
# `code add` (ADR-UREQ-RUSTLS-FETCH): HTTPS through rustls with the WebPKI roots, and nothing else
# of `ureq`.
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
# The private directory of an evaluation (DES-RULE-EXECUTION), removed when it ends.
tempfile = "3.27"
# The head of a request to the daemon's listener for browsers (ADR-HTTPARSE-LISTENER), the
# parser that `ureq` already builds.
httparse = "1.10.1"

# The host tests hash the files that a browser workspace is given, as its change set's `base` does
# (VER-BROWSER-WORKSPACE).
[dev-dependencies]
blake3 = "1.8"

# The limits of the `souffle` child process (DES-RULE-EXECUTION); the daemon's user ID, peer
# credentials, `fork`, `setsid` and signals (DES-DAEMON-LIFECYCLE); and the CPU time of the
# scaling test (DES-PERFORMANCE-HARNESS).
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
# An interrupted evaluation removes its private directory before Mara ends (DES-RULE-EXECUTION).
signal-hook = { version = "0.3.18", default-features = false }

# Nx keys (nx-rust): what the tests read at run time: the variables that the client and its test
# hooks read, `TMPDIR`, under which the daemon tests derive socket paths of
# limited length, the mode and bytes of the pinned Soufflé that `scripts/build-souffle.sh` builds
# beside the artifact directory, and the tag `v0.3.0` that the conversion tests archive. The host
# tests (`tests/hosts`) also read the browser package's files, its WebAssembly module, which
# `mara-browser:build` copies there, Playwright's library and the browser it runs, found through
# `PLAYWRIGHT_BROWSERS_PATH` or the per-user cache, and the `node` on `PATH`.
[package.metadata.nx.targets.test]
inputs = [
  "{workspaceRoot}/packages/mara-browser/**/*",
  { dependentTasksOutputFiles = "**/*.wasm" },
  { env = "PLAYWRIGHT_BROWSERS_PATH" },
  { runtime = "node --version 2>&1; node -e \"import('playwright').then(({ chromium }) => console.log(require('playwright/package.json').version, chromium.executablePath()))\" 2>&1; true" },
  "...",
  { env = "CI" },
  { env = "MARA_NO_DAEMON" },
  { env = "TMPDIR" },
  { env = "MARA_TEST_PAUSE" },
  { env = "MARA_TEST_PAUSE_EVALUATION" },
  { env = "MARA_TEST_PAUSE_WATCH" },
  { env = "MARA_TEST_DERIVED" },
  { env = "MARA_TEST_IDLE_SECONDS" },
  { env = "MARA_TEST_GRAMMAR_LOAD_MS" },
  { env = "MARA_TEST_GRAMMAR_BUDGET_MS" },
  { env = "MARA_TEST_GRAMMAR_STALL" },
  { env = "MARA_TEST_GRAMMAR_LOAD_STALL" },
  { env = "MARA_TEST_GRAMMAR_EVENTS" },
  { env = "MARA_TEST_GRAMMAR_CATALOG" },
  { env = "MARA_TEST_PAUSE_ANSWER" },
  { runtime = "s=${CARGO_TARGET_DIR:-target}/souffle-2.5/souffle; ls -Ln \"$s\" 2>&1 | cut -c1-10; sha256sum \"$s\" 2>&1; true" },
  { runtime = "git rev-parse 'v0.3.0^{tree}' 2>&1 || true" },
]
dependsOn = [
  "...",
  { projects = ["cargo-workspace"], target = "souffle" },
  { projects = ["mara-browser"], target = "build" },
]

# `project validate` of this repository's own project (ADR-NX-RUST-TASKS), with the command of the
# local check. It reads `docs/`, `.mara/`, the crates' files (their Rust files, `.gitignore` files
# and any nested project's `.mara/config.toml`), the root `.gitignore`, the pinned grammar in the
# per-user cache on Linux or macOS, the variables that the debug build and its test hooks read,
# `TMPDIR`, under which rule evaluations run, and the Soufflé they run. As a cargo command it also
# reads the repository's Cargo configuration and the `CARGO_TARGET_*` variables, such as a runner.
# The dependencies' outputs, the `mara` executable and the Soufflé folder, are in the key, and
# Nx hashes it after they have run.
[package.metadata.nx.targets.validate]
command = "cargo run --package mara --locked --quiet -- --no-daemon project validate"
cache = true
dependsOn = ["build", { projects = ["cargo-workspace"], target = "souffle" }]
inputs = [
  "{workspaceRoot}/docs/**/*",
  "{workspaceRoot}/.mara/**/*",
  "{workspaceRoot}/crates/**/*",
  "{workspaceRoot}/.gitignore",
  "{workspaceRoot}/.cargo/config.toml",
  "{workspaceRoot}/.cargo/config",
  "{workspaceRoot}/rust-toolchain.toml",
  { dependentTasksOutputFiles = "**/*" },
  { env = "TMPDIR" },
  { env = "MARA_TEST_PAUSE" },
  { env = "MARA_TEST_PAUSE_EVALUATION" },
  { env = "MARA_TEST_PAUSE_WATCH" },
  { env = "MARA_TEST_DERIVED" },
  { env = "MARA_TEST_IDLE_SECONDS" },
  { env = "MARA_TEST_GRAMMAR_LOAD_MS" },
  { env = "MARA_TEST_GRAMMAR_BUDGET_MS" },
  { env = "MARA_TEST_GRAMMAR_STALL" },
  { env = "MARA_TEST_GRAMMAR_LOAD_STALL" },
  { env = "MARA_TEST_GRAMMAR_EVENTS" },
  { env = "MARA_TEST_GRAMMAR_CATALOG" },
  { env = "MARA_TEST_PAUSE_ANSWER" },
  { runtime = "s=${CARGO_TARGET_DIR:-target}/souffle-2.5/souffle; ls -Ln \"$s\" 2>&1 | cut -c1-10; sha256sum \"$s\" 2>&1; true" },
  { runtime = "env | grep -E '^CARGO_TARGET_' | LC_ALL=C sort; true" },
  { runtime = "c=${XDG_CACHE_HOME:-}; case $c in /*) ;; *) c=$HOME/.cache ;; esac; for d in \"$c\" \"$HOME/Library/Caches\"; do (cd \"$d/mara/grammars\" 2>&1 && find -L . -type f -exec sha256sum {} + | LC_ALL=C sort); done; true" },
]

# The scaling test of the local checks times a release build: `nx run mara:test:performance`, which
# `pnpm run checks` runs as a command of its own with `--skip-nx-cache` (ADR-NX-RUST-TASKS).
[package.metadata.nx.targets.test.configurations.performance]
test = "performance"
profile = "release"

# The `mara` that the native npm package ships: `nx run mara:build:release`, on which the target
# `pack-native` of `packages/mara-npm` depends (DES-RELEASE-WORKFLOW).
[package.metadata.nx.targets.build.configurations.release]
profile = "release"
