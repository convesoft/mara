[package]
name = "docs-checks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The checks of this repository's `docs/` and `.mara/` (ADR-NX-RUST-TASKS): tests only. The crate
# is never published, nothing depends on it and no package holds it. Nx's host release-profile build
# compiles all workspace members in a staging directory and retains the requested crate's artifacts.
[dev-dependencies]
mara = { path = "../mara" }
mara-engine = { path = "../mara-engine" }
serde_json = "1.0.154"
tempfile = "3.27"

# Nx keys (nx-rust): the tests read docs/, .mara/ and Mara's templates from the checkout at run
# time. The project checks create temporary projects under TMPDIR.
[package.metadata.nx.targets.test]
inputs = [
  "...",
  "{workspaceRoot}/docs/**/*",
  "{workspaceRoot}/.mara/**/*",
  "{workspaceRoot}/crates/mara/templates/**/*",
  { env = "TMPDIR" },
]
