[workspace]
resolver = "3"
members = [
    "crates/mara-core",
    "crates/mara-markdown",
    "crates/mara-engine",
    "crates/mara-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
mara-core = { path = "crates/mara-core" }
mara-markdown = { path = "crates/mara-markdown" }
mara-engine = { path = "crates/mara-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
regex = "1"
regex-lite = "0.1.9"
sha2 = "0.10"
saphyr-parser = "0.0.11"
ulid = { version = "3.0.0", default-features = false }
getrandom = "0.4.3"
toml = "0.8"
ignore = "0.4"
wax = "0.7"
rushdown = "0.18.0"
tempfile = "3"
libc = "0.2"
petgraph = { version = "0.8", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }
