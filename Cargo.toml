[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.0-rc.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/convesoft/mara"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"

# Every `test` task runs its crate's tests with cargo-nextest, then its doctests; a task that names
# one test target runs only that target (ADR-NX-RUST-TASKS).
[workspace.metadata.nx]
testRunner = "nextest"

# Nx targets of the workspace project `cargo-workspace` (ADR-NX-RUST-TASKS). `souffle` builds or
# checks the pinned Soufflé that the tests and `project validate` run; it is not cached, because
# what it builds depends on the host's C++ toolchain and a download, and its check of an existing
# binary takes about a second.
[workspace.metadata.nx.project.targets.souffle]
command = "scripts/build-souffle.sh"
outputs = ["{workspaceRoot}/target/souffle-2.5"]
cache = false

# `zban check` reads `.zban/`, archive included, and its result depends on the `zban` it runs: the
# exact devDependency in `node_modules/.bin`, which Nx puts first on the command's PATH, else one on
# PATH. The key runs that same `zban`, found the same way also when `nx` runs without `pnpm`: its
# `--version`, or the error of a dispatcher whose native package is missing, and the SHA-256 of the
# file it starts from, which is the native binary when that is the one on PATH.
[workspace.metadata.nx.project.targets.zban-check]
command = "zban check"
cache = true
inputs = ["{workspaceRoot}/.zban/**/*", { runtime = "PATH=\"$PWD/node_modules/.bin:$PATH\"; zban --version 2>&1; sha256sum \"$(command -v zban)\" 2>&1; true" }]
