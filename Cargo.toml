[workspace]
resolver = "3"
members = ["."]

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2024"

[package]
name = "mara"
version.workspace = true
edition.workspace = true
authors = ["Aliaksei Raketski"]
description = "Structured project knowledge for humans and software agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/convesoft/mara"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
rmcp = { version = "3.2", features = ["schemars", "server", "transport-io"] }
rushdown = "0.18.0"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.2"
tempfile = "3"
tokio = { version = "1", features = ["io-std", "rt"] }
toml = "1.1"
unicode-casefold = "0.2"
unicode-normalization = "0.1"
unicode-segmentation = "1.13"
