[workspace]
resolver = "3"
members = ["."]

[workspace.package]
version = "0.3.0-alpha.1"
edition = "2024"

[package]
name = "mara"
version.workspace = true
edition.workspace = true
authors = ["Aliaksei Raketski"]
description = "Structured project knowledge for humans and software agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/convesoft/mara"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
rmcp = { version = "3.2", features = ["schemars", "server", "transport-io"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.2"
tokio = { version = "1", features = ["io-std", "rt"] }
toml = "1.1"

sha2 = "0.10"
shacl = { version = "=0.3.21", default-features = false }
rudof_rdf = { version = "=0.3.21", default-features = false }
rudof_iri = "=0.3.21"

tree-sitter = { version = "0.27", features = ["wasm"] }
ignore = "0.4"
rushdown = "0.18.0"
ulid = "1"

petgraph = { version = "0.8.3", default-features = false, features = ["std"] }
strsim = "0.11"
unicode-casefold = "0.2"
unicode-normalization = "0.1"
unicode-segmentation = "1.13"
url = "2.5"

tempfile = "3"

similar = { version = "3.2.0", default-features = false, features = ["text"] }
