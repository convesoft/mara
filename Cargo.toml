[workspace]
resolver = "3"
members = [".", "crates/mara-engine", "crates/mara-wasm", "crates/mara-node"]

# CLI subprocess coverage is not present in the integration test binary's map.
[[workspace.metadata.affected.rule]]
globs = ["src/**", "crates/mara-engine/src/**", "tests/support/**"]
filterset = "package(=mara) & kind(test)"

# LLVM cannot observe embedded templates and fixture inputs.
[[workspace.metadata.affected.rule]]
globs = ["templates/**", "tests/fixtures/**", "crates/*/tests/fixtures/**"]
filterset = "all()"

# Build/test configuration changes must never rely on old coverage ranges.
[[workspace.metadata.affected.rule]]
globs = ["**/build.rs", "build.rs", ".cargo/**", ".config/**", "rust-toolchain*", "scripts/verify.sh", ".github/workflows/**"]
filterset = "all()"

[workspace.package]
version = "0.4.0-alpha.1"
edition = "2024"

[package]
name = "mara"
version.workspace = true
edition.workspace = true
authors = ["Aliaksei Raketski"]
description = "Structured project knowledge for humans and software agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/convesoft/mara"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[dependencies]
mara-engine = { path = "crates/mara-engine" }
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
rmcp = { version = "3.2", features = ["schemars", "server", "transport-io"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.2"
tokio = { version = "1", features = ["io-std", "rt"] }
toml = "1.1"

sha2 = "0.10"
httparse = "1"
getrandom = "0.3"

tree-sitter = { version = "0.27", features = ["wasm"] }
ignore = "0.4"
ulid = "1"

url = "2.5"

tempfile = "3"

scip = "0.10.0"
protobuf = "=3.7.2"
