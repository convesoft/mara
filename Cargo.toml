[workspace]
resolver = "3"
members = [
    "crates/mara-core",
    "crates/mara-markdown",
    "crates/mara-engine",
    "crates/mara-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.lints.clippy]
disallowed_methods = "allow"

[workspace.dependencies]
mara-core = { path = "crates/mara-core" }
mara-markdown = { path = "crates/mara-markdown" }
mara-engine = { path = "crates/mara-engine" }
proc-macro2 = "1"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "3", features = ["full", "visit"] }
toml = "0.8"
tempfile = "3"
libc = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }
