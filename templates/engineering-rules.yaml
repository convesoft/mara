# Structural endpoint refinements and accepted-definition completeness.
- id: rule:accepted
  property: [{path: status, hasValue: accepted}]
- id: rule:requirement-endpoints
  targetClass: requirement
  property: [{path: satisfies, class: need}]
- id: rule:design-endpoints
  targetClass: design
  property: [{path: satisfies, class: requirement}]
- id: rule:verification
  targetClass: verification
  whenShape: rule:accepted
  property:
    - {path: methods, minCount: 1}
    - path: verifies
      qualifiedValueShape: {class: requirement, node: rule:accepted}
      qualifiedMinCount: 1
- id: rule:validation
  targetClass: validation
  whenShape: rule:accepted
  property:
    - {path: methods, minCount: 1}
    - path: validates
      qualifiedValueShape: {node: rule:accepted}
      qualifiedMinCount: 1
- id: rule:risk
  targetClass: risk
  whenShape: rule:accepted
  property:
    - {path: likelihood, minCount: 1, maxCount: 1}
    - {path: consequence, minCount: 1, maxCount: 1}
    - path: threatens
      qualifiedValueShape: {node: rule:accepted}
      qualifiedMinCount: 1
- id: rule:term-aliases
  targetClass: term
  property: [{path: aliases, pattern: '\S'}]
