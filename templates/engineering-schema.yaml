format_version: 3
flavours:
  goal:
    description: A desired outcome and why it matters.
    use_when: [State a durable stakeholder or engineering outcome.]
    avoid_when: [Record implementation steps or delivery progress.]
    distinguish_from: {need: A need states a stakeholder capability or condition.}
    id_prefix: GOAL-
    body: required
    fields:
      status: {type: enum, required: true, values: [draft, accepted, retired]}
  need:
    description: A stakeholder capability, condition or result without prescribing realization.
    use_when: [Specify what stakeholders need in their operational context.]
    avoid_when: [Prescribe a technical solution.]
    distinguish_from: {requirement: A requirement is an objectively verifiable system obligation.}
    id_prefix: NEED-
    body: required
    fields:
      status: {type: enum, required: true, values: [draft, accepted, retired]}
  scenario:
    description: A concrete operational situation or flow and its outcomes.
    use_when: [Describe actors, starting conditions, behavior and outcomes in prose.]
    avoid_when: [Track tasks or require a universal phase sequence.]
    distinguish_from: {validation: A validation defines how intended outcomes are evaluated.}
    id_prefix: SCN-
    body: required
    fields:
      status: {type: enum, required: true, values: [draft, accepted, retired]}
  requirement:
    description: A precise, necessary and verifiable obligation on the solution.
    use_when: [State one necessary obligation with an authoritative basis and objective check.]
    avoid_when: [Combine independent obligations or prescribe an unnecessary realization.]
    distinguish_from: {need: A need is stakeholder intent., design: A design specifies realization.}
    id_prefix: REQ-
    body: required
    fields:
      status: {type: enum, required: true, values: [draft, accepted, retired]}
  design:
    description: An engineering specification of a realization.
    use_when: [Define a durable interface, format, boundary or realization with engineering purpose.]
    avoid_when: [Duplicate routine code organization or invent requirements for internal improvements.]
    distinguish_from: {requirement: A requirement specifies an obligation., decision: A decision records choice and rationale.}
    id_prefix: DES-
    body: required
    fields:
      status: {type: enum, required: true, values: [draft, accepted, retired]}
  decision:
    description: A consequential engineering choice, its context and rationale.
    use_when: [Preserve meaningful alternatives, authority and consequences of a choice.]
    avoid_when: [Record routine reversible details or infer risk acceptance from inactivity.]
    distinguish_from: {design: A design specifies the chosen realization.}
    id_prefix: ADR-
    body: required
    fields:
      status: {type: enum, required: true, values: [draft, accepted, retired]}
  risk:
    description: Uncertainty that could adversely affect a goal, need or requirement.
    use_when: [Record a material uncertain cause and adverse consequence.]
    avoid_when: [Track known defects or store derived severity or treatment state.]
    distinguish_from: {}
    id_prefix: RISK-
    body: required
    fields:
      status: {type: enum, required: true, values: [draft, accepted, retired]}
      likelihood: {type: enum, values: [rare, unlikely, possible, likely, almost-certain]}
      consequence: {type: enum, values: [minimal, minor, moderate, major, severe]}
  term:
    description: A canonical project or domain definition with equivalent aliases.
    use_when: [Define vocabulary whose ambiguity affects engineering work.]
    avoid_when: [Duplicate ordinary words or introduce a broader terminology ontology.]
    distinguish_from: {}
    id_prefix: TERM-
    body: required
    fields:
      status: {type: enum, required: true, values: [draft, accepted, retired]}
      aliases: {type: string, repeatable: true}
  evidence:
    description: A durable empirical or analytical conclusion with interpretable provenance.
    use_when: [Preserve a significant investigation, assessment, experiment or benchmark conclusion.]
    avoid_when: [Persist routine CI runs or confuse observation with interpretation.]
    distinguish_from: {verification: Verification defines conformity checks., validation: Validation defines outcome checks.}
    id_prefix: EVD-
    body: required
    fields:
      status: {type: enum, required: true, values: [draft, accepted, retired]}
  verification:
    description: A definition of how requirement conformity is established.
    use_when: [Define an objective conformity procedure and criteria.]
    avoid_when: [Claim a passing execution from a definition or test-code link.]
    distinguish_from: {validation: Validation evaluates stakeholder outcomes in operational context.}
    id_prefix: VER-
    body: required
    fields:
      status: {type: enum, required: true, values: [draft, accepted, retired]}
      methods: {type: enum, repeatable: true, values: [test, analysis, inspection, demonstration]}
  validation:
    description: A definition of how need satisfaction or goal achievement is established.
    use_when: [Define an intended-outcome evaluation in operational context.]
    avoid_when: [Treat passing conformity checks as proof of stakeholder success.]
    distinguish_from: {verification: Verification checks conformity to requirements.}
    id_prefix: VAL-
    body: required
    fields:
      status: {type: enum, required: true, values: [draft, accepted, retired]}
      methods: {type: enum, repeatable: true, values: [test, analysis, inspection, demonstration]}
relations:
  contributes_to:
    description: Achieving the source helps achieve the goal without guaranteeing it.
    source: [need, design]
    target: [goal]
    inverse: contributed_to_by
  satisfies:
    description: The source specifies something intended to fulfill the target at the next engineering level; not proof.
    source: [requirement, design]
    target: [need, requirement]
    inverse: satisfied_by
  decomposes:
    description: The source is a constituent of the same-flavour parent; child-to-parent, not complete decomposition proof.
    source: [need, requirement, design]
    target: [need, requirement, design]
    same_flavour: true
    inverse: decomposed_by
  derives_from:
    description: The requirement follows analytically from the target requirement; not generic origin tracking.
    source: [requirement]
    target: [requirement]
    inverse: gives_rise_to
  supersedes:
    description: A distinct same-flavour replacement takes over operative meaning while preserving historical lineage.
    source: [goal, need, scenario, requirement, design, decision, term, verification, validation]
    target: [goal, need, scenario, requirement, design, decision, term, verification, validation]
    same_flavour: true
    inverse: superseded_by
    acyclic: {severity: error}
  justifies:
    description: The decision supplies rationale for establishing or choosing the requirement or design.
    source: [decision]
    target: [requirement, design]
    inverse: justified_by
  accepts:
    description: An authorized decision explicitly tolerates the risk; the link alone does not establish authority.
    source: [decision]
    target: [risk]
    inverse: accepted_by
  threatens:
    description: The uncertainty could prevent or degrade the target's achievement.
    source: [risk]
    target: [goal, need, requirement]
    inverse: threatened_by
  mitigates:
    description: The requirement or design is intended to reduce likelihood or consequence; not proof of effectiveness.
    source: [requirement, design]
    target: [risk]
    inverse: mitigated_by
  verifies:
    description: The verification defines an objective conformity check for the requirement.
    source: [verification]
    target: [requirement]
    inverse: verified_by
  validates:
    description: The validation defines an intended-outcome check for the need or goal.
    source: [validation]
    target: [need, goal]
    inverse: validated_by
  exercises:
    description: The validation uses the scenario as operational context.
    source: [validation]
    target: [scenario]
    inverse: exercised_by
  supports:
    description: The evidence supplies empirical or analytical support for engineering reasoning.
    source: [evidence]
    target: [goal, need, requirement, design, decision, risk]
    inverse: supported_by
  implements:
    description: An external code reference realizes a requirement or design, or a test reference realizes a verification; not execution evidence.
    source: []
    target: [requirement, design, verification]
    code_source: true
    inverse: implemented_by
